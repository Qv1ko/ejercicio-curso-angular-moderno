<header class="site-header">
  <a class="brand" routerLink="/" aria-label="Cumbre, página principal">
    <span class="brand-mark" aria-hidden="true"><img src="/icon.svg" alt="" /></span>
    <span>CUMBRE<span class="brand-dot">.</span></span>
  </a>

  @if (mode() === 'catalog') {
  <nav class="header-actions" aria-label="Navegación de usuario">
    <a class="purchases-link" routerLink="/compras">Últimas compras</a>
    <a
      class="cart-button"
      routerLink="/carrito"
      [attr.aria-label]="'Ver carrito, ' + cartCount() + ' productos'"
    >
      <span class="cart-icon-wrap">
        <img class="cart-icon" src="/cart-shopping.svg" alt="" aria-hidden="true" />
        <span class="cart-count" aria-hidden="true">{{ cartCount() }}</span>
      </span>
      <span class="cart-label">Mi carrito</span>
    </a>
  </nav>
  } @else if (mode() === 'cart') {
  <a class="back-link" routerLink="/">
    <span>Seguir comprando</span>
    <img class="back-arrow" src="/arrow-up-right.svg" alt="" aria-hidden="true" />
  </a>
  } @else {
  <a class="back-link" routerLink="/">
    <span>Listado de productos</span>
    <img class="back-arrow" src="/arrow-up-right.svg" alt="" aria-hidden="true" />
  </a>
  }
</header>
