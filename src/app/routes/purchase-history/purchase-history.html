<main class="history-shell">
  <app-header mode="history" />

  <section class="history-content" aria-labelledby="history-title">
    @if (isLoading()) {
    <app-status-message message="Cargando compras..." />
    } @else if (hasError()) {
    <app-status-message
      message="No hemos podido cargar tus compras. Comprueba que JSON Server está activo."
      [error]="true"
      role="alert"
    />
    } @else if (purchases().length === 0) {
    <app-status-message message="Todavía no has realizado ninguna compra." />
    } @else {
    <div class="purchase-list">
      @for (purchase of purchases(); track purchase.id) {
      <app-purchase-card [purchase]="purchase" />
      }
    </div>
    }
  </section>
</main>
